name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an active main deployment finish before the next main workflow starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typespec/package-lock.json

      - name: Install TypeSpec dependencies
        working-directory: typespec
        run: npm ci

      - name: Build OpenAPI contract
        working-directory: typespec
        run: npm run build

      - name: Check committed OpenAPI contract
        run: git diff --exit-code -- src/main/resources/openapi/openapi.yaml

  build:
    name: build
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # GitHub-hosted Linux runners provide Docker for PostgreSQL Testcontainers.
      - name: Build JAR and run unit and component tests
        run: ./mvnw -B verify

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: core-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload component test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: component-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: core-jar
          path: target/release
      - name: Prepare tested JAR
        run: cp target/release/*.jar deploy/image/app.jar
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: deploy/image
          push: true
          tags: ghcr.io/is-courswork/core:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/is-courswork/core
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: deploy
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://airlines.arhr.tech/info
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Package release configuration and contract
        run: |
          mkdir -p deploy/static/openapi
          cp src/main/resources/openapi/openapi.yaml deploy/static/openapi/core.yaml
          tar -czf release.tar.gz -C deploy compose.yaml Caddyfile static postgres
      - name: Deploy published image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          CORE_IMAGE: ghcr.io/is-courswork/core@${{ needs.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          scp -o BatchMode=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/airlines/incoming/$COMMIT.tar.gz"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$CORE_IMAGE" "$COMMIT" "$RUN_URL" < deploy/deploy.sh
      - name: Verify public routes
        run: |
          for path in /api/core/actuator/health /info /swagger/ /openapi/core.yaml /postgres/; do
            curl --fail --silent --show-error --location --max-time 20 \
              --retry 10 --retry-all-errors --retry-delay 3 \
              "https://airlines.arhr.tech$path" > /dev/null
            echo "Verified $path"
          done

      - name: Remove temporary registry credentials
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" docker logout ghcr.io

      - name: Remove temporary SSH credentials
        if: ${{ always() }}
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
